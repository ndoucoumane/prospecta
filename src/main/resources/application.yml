spring:
  application:
    name: prospecta-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: console

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:${KEYCLOAK_AUTH_SERVER_URL:https://auth.clatous.com}/realms/${KEYCLOAK_REALM:clatous-production}}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_AUTH_SERVER_URL:https://auth.clatous.com}/realms/${KEYCLOAK_REALM:clatous-production}/protocol/openid-connect/certs}

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8085}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Management & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

# Structured Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [traceId=%X{traceId:-}, orgId=%X{organizationId:-}, userId=%X{userId:-}] - %msg%n"
  level:
    root: INFO
    com.prospecta: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

# Prospecta Specific Business & Feature Flags Configuration
prospecta:
  defaults:
    country: SN
    timezone: Africa/Dakar
    currency: XOF
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
    keycloak:
      realm: ${KEYCLOAK_REALM:clatous-production}
      auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:https://auth.clatous.com}
      client-id: ${KEYCLOAK_CLIENT_ID:clatous-backend-prod}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:QWyJjXyZ7GPibKO21mw10lY3J2AzJlvqoU2IA6ODHxLlumIynJVPQxLzJolNYxRc2toMheLInzdcKYLeMStJKE}
  features:
    whatsapp-enabled: ${WHATSAPP_ENABLED:false}
    sms-enabled: ${SMS_ENABLED:false}
    ai-enabled: ${AI_ENABLED:true}
    campaign-enabled: ${CAMPAIGN_ENABLED:true}
  ai:
    provider: ${AI_PROVIDER:openai}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    api-key: ${OPENAI_API_KEY:}
  messaging:
    whatsapp:
      api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
      webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:prospecta_verify_token_dev}
      app-secret: ${WHATSAPP_APP_SECRET:}
  campaign:
    max-concurrent: ${CAMPAIGN_MAX_CONCURRENT:10}
  billing:
    stripe:
      api-key: ${STRIPE_API_KEY:sk_test_placeholder}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
    plans:
      starter:
        price-id: ${STRIPE_PRICE_STARTER:price_starter_test}
        amount: 29000
        currency: XOF
      business:
        price-id: ${STRIPE_PRICE_BUSINESS:price_business_test}
        amount: 79000
        currency: XOF

# Apollo B2B Data Provider Configuration
apollo:
  base-url: ${APOLLO_BASE_URL:https://api.apollo.io}
  api-key: ${APOLLO_API_KEY:}
  timeout-seconds: ${APOLLO_TIMEOUT_SECONDS:15}

# Keycloak Identity Provider (IdP) Configuration
keycloak:
  realm: ${KEYCLOAK_REALM:clatous-production}
  auth-server-url: ${KEYCLOAK_AUTH_SERVER_URL:https://auth.clatous.com}
  client-id: ${KEYCLOAK_CLIENT_ID:clatous-backend-prod}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:QWyJjXyZ7GPibKO21mw10lY3J2AzJlvqoU2IA6ODHxLlumIynJVPQxLzJolNYxRc2toMheLInzdcKYLeMStJKE}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:keycloak-admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:soloSaliou10@}
  admin-realm: ${KEYCLOAK_ADMIN_REALM:master}
  credentials:

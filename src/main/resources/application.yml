spring:
  application:
    name: prospecta-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: console

  jackson:
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

# Management & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha

# Structured Logging
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [traceId=%X{traceId:-}, orgId=%X{organizationId:-}, userId=%X{userId:-}] - %msg%n"
  level:
    root: INFO
    com.prospecta: INFO
    org.springframework.security: INFO
    org.springframework.web: INFO

# Prospecta Specific Business & Feature Flags Configuration
prospecta:
  defaults:
    country: SN
    timezone: Africa/Dakar
    currency: XOF
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
      allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
      allowed-headers: "*"
      allow-credentials: true
  features:
    whatsapp-enabled: ${WHATSAPP_ENABLED:false}
    sms-enabled: ${SMS_ENABLED:false}
    ai-enabled: ${AI_ENABLED:true}
    campaign-enabled: ${CAMPAIGN_ENABLED:true}
  ai:
    provider: ${AI_PROVIDER:openai}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    api-key: ${OPENAI_API_KEY:}
  messaging:
    whatsapp:
      api-url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0}
      webhook-verify-token: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:prospecta_verify_token_dev}
      app-secret: ${WHATSAPP_APP_SECRET:}
  campaign:
    max-concurrent: ${CAMPAIGN_MAX_CONCURRENT:10}
